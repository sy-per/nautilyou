# Nautilyou : fichier autonome (a copier tel quel dans Portainer, Dockge ou un dossier vide).
# Il construit les images directement depuis GitHub : pas besoin de cloner le depot.
#
# Variable a definir : SERVER_NAME = adresse IP (et/ou nom) de la machine, ex. 192.168.1.50
#   docker compose -f docker-compose.standalone.yml up -d --build
# (ou renseigner SERVER_NAME dans l'interface de Portainer/Dockge).
#
# Pour un depot PRIVE, remplacer https://github.com/... par
#   https://<UTILISATEUR>:<JETON>@github.com/sy-per/nautilyou.git
# avec un jeton d'acces personnel GitHub (lecture du depot). Depot public : rien a changer.

services:
  server:
    build: https://github.com/sy-per/nautilyou.git#main:server
    container_name: nautilyou-server
    restart: unless-stopped
    environment:
      PORT: 4100
      DB_PATH: /data/nautilyou.db
    volumes:
      - nautilyou_data:/data

  web:
    build: https://github.com/sy-per/nautilyou.git#main:dashboard-ui
    container_name: nautilyou-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      SERVER_NAME: ${SERVER_NAME:?Definir SERVER_NAME (adresse IP de la machine)}
    volumes:
      - nautilyou_certs:/certs

volumes:
  nautilyou_data:
  nautilyou_certs:
