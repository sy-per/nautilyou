# HTTP : simple redirection vers HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS : dashboard + API + WebSocket des appareils, tout sur le meme port.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://server:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket persistant des appareils : upgrade HTTP et delai long (le client se reconnecte de lui-meme).
    location /ws/ {
        proxy_pass http://server:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
