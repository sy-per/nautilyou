services:
  server:
    build: ./server
    container_name: nautilyou-server
    restart: unless-stopped
    ports:
      - "4100:4100" # API REST + WebSocket temps réel (/ws/device)
    volumes:
      - nautilyou_data:/data
      # - ./server/certs:/certs:ro
    environment:
      PORT: 4100
      DB_PATH: /data/nautilyou.db
      # TLS optionnel (HTTPS + WSS) : decommenter ces 2 lignes ET le volume ./server/certs ci-dessous
      # apres avoir genere un certificat avec server/gen-cert.sh.
      # TLS_CERT_FILE: /certs/server.crt
      # TLS_KEY_FILE: /certs/server.key

volumes:
  nautilyou_data:
