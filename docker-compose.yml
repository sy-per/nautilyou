# Nautilyou (serveur) : deux conteneurs.
#   - server : API + WebSocket des appareils + base SQLite. Non expose : joignable seulement par "web".
#   - web    : nginx. Sert le dashboard et relaie /api et /ws/device vers "server", en HTTPS
#              (certificat auto-signe genere au premier demarrage, conserve dans le volume nautilyou_certs).
#
# Reglages : copier .env.example en .env (voir README.md).

services:
  server:
    build: ./server
    container_name: nautilyou-server
    restart: unless-stopped
    environment:
      PORT: 4100
      DB_PATH: /data/nautilyou.db
    volumes:
      - nautilyou_data:/data

  web:
    build: ./dashboard-ui
    container_name: nautilyou-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - nautilyou_certs:/certs

volumes:
  nautilyou_data:
  nautilyou_certs:
